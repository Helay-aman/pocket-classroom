<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pocket Classroom</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg sticky-top navbar-dark bg-dark border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Pocket Classroom</a>
    <div class="d-flex gap-2">
      <button id="btnNew" class="btn btn-sm btn-success" aria-label="New Capsule"><i class="fa fa-plus"></i> New Capsule</button>
      <input id="importFile" type="file" accept="application/json" class="d-none" />
      <button id="btnImport" class="btn btn-sm btn-outline-light" aria-label="Import Capsule"><i class="fa fa-file-import"></i> Import JSON</button>
      <button id="themeToggle" class="btn btn-sm btn-outline-light" aria-label="Toggle Theme">Theme</button>
    </div>
  </div>
</nav>

<main class="container my-4">
  <!-- Tabs -->
  <ul id="topTabs" class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item"><a class="nav-link active" data-target="library" href="#" role="tab">Library</a></li>
    <li class="nav-item"><a class="nav-link" data-target="author" href="#" role="tab">Author</a></li>
    <li class="nav-item"><a class="nav-link" data-target="learn" href="#" role="tab">Learn</a></li>
  </ul>

  <!-- Sections -->
  <section id="library" class="app-section">
    <div id="libraryGrid" class="row g-3"></div>
    <div id="emptyLib" class="text-center mt-4 text-muted" style="display:none;">
      <p>No capsules yet. Click New Capsule to start.</p>
    </div>
  </section>

  <section id="author" class="app-section" style="display:none;">
    <form id="authorForm" class="row g-3">
      <input id="capsuleId" type="hidden" />
      <div class="col-12 col-md-6">
        <label class="form-label">Title *</label>
        <input id="metaTitle" class="form-control" required />
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label">Subject</label>
        <input id="metaSubject" class="form-control" />
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label">Level</label>
        <select id="metaLevel" class="form-select">
          <option>Beginner</option>
          <option>Intermediate</option>
          <option>Advanced</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea id="metaDesc" class="form-control" rows="2"></textarea>
      </div>

      <!-- Notes -->
      <div class="col-12">
        <label class="form-label">Notes (one per line or markdown-lite)</label>
        <textarea id="notesArea" class="form-control" rows="4" placeholder="Line 1&#10;Line 2"></textarea>
      </div>

      <!-- Flashcards editor -->
      <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="form-label m-0">Flashcards</label>
          <div>
            <button id="addCard" type="button" class="btn btn-sm btn-outline-light"><i class="fa fa-plus"></i> Add</button>
          </div>
        </div>
        <div id="flashcardsEditor" class="list-group mb-2"></div>
      </div>

      <!-- Quiz editor -->
      <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="form-label m-0">Quiz</label>
          <button id="addQuestion" type="button" class="btn btn-sm btn-outline-light"><i class="fa fa-plus"></i> Add</button>
        </div>
        <div id="quizEditor" class="accordion accordion-flush"></div>
      </div>

      <div class="col-12 d-flex gap-2">
        <button id="btnSave" type="submit" class="btn btn-primary">Save Capsule</button>
        <button id="btnCancelEdit" type="button" class="btn btn-outline-light">Cancel</button>
        <div id="authorMsg" class="ms-auto text-muted align-self-center"></div>
      </div>
    </form>
  </section>

  <section id="learn" class="app-section" style="display:none;">
    <div class="d-flex mb-3 gap-2 align-items-center">
      <select id="learnSelector" class="form-select w-auto" aria-label="Select capsule"></select>
      <div class="btn-group" role="tablist" aria-label="Learn tabs">
        <button class="btn btn-outline-light active" data-learn-tab="notes">Notes</button>
        <button class="btn btn-outline-light" data-learn-tab="flashcards">Flashcards</button>
        <button class="btn btn-outline-light" data-learn-tab="quiz">Quiz</button>
      </div>
    </div>

    <div id="learnMeta" class="mb-3"></div>

    <div id="learnNotes" class="learn-pane">
      <input id="noteSearch" class="form-control mb-2" placeholder="Search notes..." />
      <ol id="notesList" class="ps-3"></ol>
    </div>

    <div id="learnFlashcards" class="learn-pane" style="display:none;">
      <div class="card bg-secondary text-light p-3 mb-2">
        <div id="flashcardArea" class="d-flex justify-content-center align-items-center" style="min-height:140px; perspective:1000px;"></div>
        <div class="d-flex gap-2 mt-2">
          <button id="prevCard" class="btn btn-sm btn-outline-light">Prev</button>
          <button id="flipCard" class="btn btn-sm btn-outline-light">Flip (Space)</button>
          <button id="nextCard" class="btn btn-sm btn-outline-light">Next</button>
          <button id="markKnown" class="btn btn-sm btn-success ms-auto">Known</button>
          <button id="markUnknown" class="btn btn-sm btn-outline-light">Unknown</button>
        </div>
        <div id="cardCounters" class="mt-2 text-muted small"></div>
      </div>
    </div>

    <div id="learnQuiz" class="learn-pane" style="display:none;">
      <div id="quizArea" class="card bg-secondary text-light p-3">
        <div id="quizQuestion"></div>
        <div id="quizChoices" class="mt-2"></div>
        <div id="quizControls" class="mt-3 text-muted small"></div>
      </div>
    </div>

  </section>

  <footer class="text-center text-muted small mt-4">Pocket Classroom — Offline demo</footer>
</main>

<!-- JS Modules -->
<script type="module" src="js/main.js"></script>

<!-- Bootstrap JS (for components if needed) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
